name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: polizador
          POSTGRES_PASSWORD: polizador
          POSTGRES_DB: polizador
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      SECRET_KEY: "ci-test-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost"
      DBHOST: "localhost"
      DBUSER: "polizador"
      DBNAME: "polizador"
      DBPASSWORD: "polizador"
      CACHE_URL: "redis://localhost:6379/0"
      REDIS_URL: "redis://localhost:6379/1"
      SENTRY_DSN: ""
      MAILGUN_API_KEY: "dummy"
      MAILGUN_SENDER_DOMAIN: "example.com"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GDAL/GEOS system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin

      - name: Install Python dependencies
        run: pip install -r polizador/requirements.txt

      - name: Run Django test suite
        working-directory: polizador
        run: python manage.py test

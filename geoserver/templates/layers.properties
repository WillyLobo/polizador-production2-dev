# CHALLENGE, no HIDE (decisión resuelta durante el spike N:N, 2026-09-10):
# con HIDE, un anónimo pide una capa protegida y GeoServer devuelve "tipo
# desconocido" (HTTP 400, SIN header WWW-Authenticate) en vez de un 401 real
# -- verificado con curl. Sin un 401, QGIS no tiene ninguna señal de que ahí
# hace falta loguearse, así que marca la capa directo como "no disponible"
# en vez de ofrecer el prompt de credenciales (se vio en vivo: las 9 capas
# del paquete de prueba aparecían todas como no disponibles, con "Explorar"
# deshabilitado). Con CHALLENGE, GeoServer manda 401 + WWW-Authenticate, que
# es lo que QGIS (y cualquier cliente HTTP estándar) sabe interpretar para
# pedir usuario/contraseña. Efecto secundario aceptado: un anónimo ve el
# NOMBRE de las capas protegidas en GetCapabilities (no sus datos, eso sigue
# bloqueado igual) -- mode=HIDE ocultaba hasta la existencia de la capa,
# CHALLENGE ya no.
mode=CHALLENGE
*.*.r=*
*.*.w=GROUP_ADMIN,ADMIN
gdu.localidad.r=LOCALIDADES_TODOS_LOS_USUARIOS,ADMIN
gdu.localidad.w=GDU_ADMIN_USER,ADMIN
gdu.manzana.r=GDU_CATASTRO_URBANO_VER,ADMIN
gdu.manzana.w=GDU_ADMIN_USER,ADMIN
gdu.calle.r=GDU_CATASTRO_URBANO_VER,ADMIN
gdu.calle.w=GDU_ADMIN_USER,ADMIN
gdu.vivienda_punto.r=GDU_VIVIENDAS_VER,ADMIN
gdu.vivienda_punto.w=GDU_ADMIN_USER,ADMIN
# Spike N:N (Intervención: inspectores/ejecutores) -- sin rol Django propio
# todavía, gate provisional GDU_ADMIN_USER para lectura y escritura (si no
# se pone un .r explícito acá, caen en el wildcard *.*.r=* de arriba, que es
# lectura PÚBLICA -- no lo que se quiere para datos de soporte de un form
# interno).
gdu.intervencion.r=GDU_ADMIN_USER,ADMIN
gdu.intervencion.w=GDU_ADMIN_USER,ADMIN
gdu.inspector.r=GDU_ADMIN_USER,ADMIN
gdu.inspector.w=GDU_ADMIN_USER,ADMIN
gdu.ejecutor.r=GDU_ADMIN_USER,ADMIN
gdu.ejecutor.w=GDU_ADMIN_USER,ADMIN
gdu.intervencion_inspector.r=GDU_ADMIN_USER,ADMIN
gdu.intervencion_inspector.w=GDU_ADMIN_USER,ADMIN
gdu.intervencion_ejecutor.r=GDU_ADMIN_USER,ADMIN
gdu.intervencion_ejecutor.w=GDU_ADMIN_USER,ADMIN
# plano_mensura/tierra -- mismo criterio que arriba, sin rol Django propio
# todavía.
gdu.plano_mensura.r=GDU_ADMIN_USER,ADMIN
gdu.plano_mensura.w=GDU_ADMIN_USER,ADMIN
gdu.plano_mensura_intervencion.r=GDU_ADMIN_USER,ADMIN
gdu.plano_mensura_intervencion.w=GDU_ADMIN_USER,ADMIN
gdu.tierra.r=GDU_ADMIN_USER,ADMIN
gdu.tierra.w=GDU_ADMIN_USER,ADMIN
gdu.plano_mensura_tierra.r=GDU_ADMIN_USER,ADMIN
gdu.plano_mensura_tierra.w=GDU_ADMIN_USER,ADMIN

{% extends "base.html" %}

{% block content  %}
{% load static %}
{% load l10n %}

{% block title %}<title>Crear Reporte Viaticos por Agente</title>{% endblock title %}

<link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css' rel='stylesheet' />
<link href='https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@7.0.2/theme.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js'></script>
<script src='https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@7.0.2/global.js'></script>
<script>

    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            locale: 'es',
            initialView: 'multiMonthYear',
            contentHeight:"auto",
            initialDate: "{{initial_date}}",
            headerToolbar: {
                start: '', // will normally be on the left. if RTL, will be on the right
                center: 'title',
                end: '' // will normally be on the right. if RTL, will be on the left
            },
            {% if agente %}
            events: {
                url: '/v1/api/calendario/agente-individual/',
                extraParams: { agente: '{{agente.id|unlocalize}}', ano: '{{ano}}' },
            },
            {% endif %}
        });
        calendar.render();
    });

</script>

<div class="min-vh-100 p-4">

  <div class="card mb-3 d-print-none">
    <div class="card-header py-2 bg-body-tertiary fw-semibold small">Filtros</div>
    <div class="card-body p-3">
      <form action="{% url "secretariador:crear-reporte-viaticos-por-agente-individual" %}" method="get">
        <div class="row g-2 mb-2">
          <div class="col-md-4">
            <label class="form-label small fw-semibold mb-1" for="inputGroupSelectAno">Año</label>
            <select name="ano" class="customSelect2" id="inputGroupSelectAno" style="width:100%;">
              {% for anio in anos_disponibles %}
              <option value="{{anio|unlocalize}}" {% if ano == anio|stringformat:"s" %}selected{% endif %}>{{anio|unlocalize}}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold mb-1" for="id_agente">Agente</label>
            <select name="agente" class="form-control" id="id_agente">
            </select>
          </div>
        </div>
        <div class="text-end">
          <input type='submit' value='Buscar' class="btn btn-primary btn-sm" />
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header py-2 bg-body-tertiary fw-semibold small">Resultados</div>
    <div class="card-body p-3">
      <div class="container-fluid" id='calendar'></div>
    </div>
  </div>
</div>

{% include "partials/select2-script-partial.html" with id_field="id_agente" url="/v1/api/select2_comisionado/" %}
{% endblock %}

{% extends "base.html" %}
{% block title %}<title>GDU - Tipos de Estado</title>{% endblock %}
{% block content %}
<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Tipos de Estado</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableTiposEstado" width="auto" class="table table-striped table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">
  $(document).ready(function() {
      var columns = [
          { data: 'nombre', name: 'nombre', title: 'Nombre' },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableTiposEstado'),
          '/v1/api/datatables/gdu-tipos-estado/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/gdu-tipos-estado/{id}/detalle/',
          },
      );
  });
</script>
{% endblock %}

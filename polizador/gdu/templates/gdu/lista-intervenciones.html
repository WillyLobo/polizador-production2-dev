{% extends "base.html" %}
{% block title %}<title>GDU - Intervenciones</title>{% endblock %}
{% block content %}
<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Intervenciones</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableIntervenciones" width="auto" class="table table-striped table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">
  $(document).ready(function() {
      var columns = [
          { data: 'nombre', name: 'nombre', title: 'Nombre' },
          { data: 'tipo', name: 'tipo', title: 'Tipo' },
          { data: 'localidad', name: 'localidad', title: 'Localidad' },
          { data: 'contratacion', name: 'contratacion', title: 'Contratación' },
          { data: 'avance', name: 'avance', title: 'Avance (%)' },
          { data: 'estado', name: 'estado', title: 'Estado' },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableIntervenciones'),
          '/v1/api/datatables/gdu-intervenciones/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/gdu-intervenciones/{id}/detalle/',
          },
      );
  });
</script>
{% endblock %}

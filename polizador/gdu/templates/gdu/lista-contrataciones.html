{% extends "base.html" %}
{% block title %}<title>GDU - Contrataciones</title>{% endblock %}
{% block content %}
<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Contrataciones</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableContrataciones" width="auto" class="table table-striped table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">
  $(document).ready(function() {
      var columns = [
          { data: 'nombre', name: 'nombre', title: 'Nombre' },
          { data: 'expediente', name: 'expediente', title: 'Expediente' },
          { data: 'resolucion', name: 'resolucion', title: 'Resolución' },
          { data: 'ano', name: 'ano', title: 'Año' },
          { data: 'tipo', name: 'tipo', title: 'Tipo' },
          { data: 'actuacion', name: 'actuacion', title: 'Actuación' },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableContrataciones'),
          '/v1/api/datatables/gdu-contrataciones/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/gdu-contrataciones/{id}/detalle/',
          },
      );
  });
</script>
{% endblock %}

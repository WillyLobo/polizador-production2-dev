{% extends "base.html" %}
{% block title %}<title>GDU - Adjudicaciones a Beneficiario</title>{% endblock %}
{% block content %}
<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Adjudicaciones a Beneficiario</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableAdjudicaciones" width="auto" class="table table-striped table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">
  $(document).ready(function() {
      var columns = [
          { data: 'nro', name: 'nro', title: 'Nro. Resolución' },
          { data: 'ano', name: 'ano', title: 'Año' },
          { data: 'tipo', name: 'tipo', title: 'Tipo' },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableAdjudicaciones'),
          '/v1/api/datatables/gdu-adjudicaciones-beneficiario/',
          columns,
          {
              order: [[1, 'desc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/gdu-adjudicaciones-beneficiario/{id}/detalle/',
          },
      );
  });
</script>
{% endblock %}

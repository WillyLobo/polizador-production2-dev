{% extends "base.html" %}
{% block title %}<title>GDU - Unidades Funcionales</title>{% endblock %}
{% block content %}
<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Unidades Funcionales</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableUfs" width="auto" class="table table-striped table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">
  $(document).ready(function() {
      var columns = [
          { data: 'uf', name: 'uf', title: 'UF' },
          { data: 'parcela', name: 'parcela', title: 'Parcela' },
          { data: 'tipo', name: 'tipo', title: 'Tipo' },
          { data: 'nro_adjudicatario', name: 'nro_adjudicatario', title: 'Nro. Adjudicatario' },
          { data: 'irregular', name: 'irregular', title: 'Irregular' },
          { data: 'fr_mat', name: 'fr_mat', title: 'Folio Real / Matrícula' },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableUfs'),
          '/v1/api/datatables/gdu-ufs/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/gdu-ufs/{id}/detalle/',
          },
      );
  });
</script>
{% endblock %}

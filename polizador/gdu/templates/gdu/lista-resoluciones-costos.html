{% extends "base.html" %}
{% block title %}<title>GDU - Resoluciones de Costos</title>{% endblock %}
{% block content %}
<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Resoluciones de Costos</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableResolucionesCostos" width="auto" class="table table-striped table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">
  $(document).ready(function() {
      var columns = [
          { data: 'nro_corto', name: 'nro_corto', title: 'Nro.' },
          { data: 'nro_largo', name: 'nro_largo', title: 'Nro. Largo' },
          { data: 'ano', name: 'ano', title: 'Año' },
          { data: 'tipo', name: 'tipo', title: 'Tipo' },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableResolucionesCostos'),
          '/v1/api/datatables/gdu-resoluciones-costos/',
          columns,
          {
              order: [[2, 'desc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/gdu-resoluciones-costos/{id}/detalle/',
          },
      );
  });
</script>
{% endblock %}

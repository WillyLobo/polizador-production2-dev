{% extends "base.html" %}
{% block title %}<title>GDU - Localidades</title>{% endblock %}
{% block content %}
<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Localidades</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableLocalidades" width="auto" class="table table-striped table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">
  $(document).ready(function() {
      var columns = [
          { data: 'localidad', name: 'localidad', title: 'Localidad' },
          { data: 'departamento', name: 'departamento', title: 'Departamento' },
          { data: 'provincia', name: 'provincia', title: 'Provincia' },
          { data: 'codloc', name: 'codloc', title: 'Cód. INDEC' },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableLocalidades'),
          '/v1/api/datatables/gdu-localidades/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/gdu-localidades/{id}/detalle/',
          },
      );
  });
</script>
{% endblock %}

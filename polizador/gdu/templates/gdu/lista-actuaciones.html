{% extends "base.html" %}
{% block title %}<title>GDU - Actuaciones</title>{% endblock %}
{% block content %}
<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Actuaciones</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableActuaciones" width="auto" class="table table-striped table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">
  $(document).ready(function() {
      var columns = [
          { data: 'nombre', name: 'nombre', title: 'Nombre' },
          { data: 'ano', name: 'ano', title: 'Año' },
          { data: 'instrumento', name: 'instrumento', title: 'Instrumento' },
          { data: 'programa', name: 'programa', title: 'Programa' },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableActuaciones'),
          '/v1/api/datatables/gdu-actuaciones/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/gdu-actuaciones/{id}/detalle/',
          },
      );
  });
</script>
{% endblock %}

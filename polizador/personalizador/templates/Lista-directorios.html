{% extends "base.html" %}
{% load static %}
{% block content %}
{% block title %}<title>Lista Directorios</title>{% endblock title%}

<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-light fw-semibold small">Directorios</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableDirectorios" width="auto" class="table table-striped table-bordered align-middle mb-0">
        </table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">

  $(document).ready(function() {
      var columns = [
          { data: 'directorio_nombre', name: 'directorio_nombre', title: 'Directorio' },
          { data: 'directorio_autoridad_a_cargo', name: 'directorio_autoridad_a_cargo', title: 'Autoridad a Cargo' },
          { data: 'directorio_cuof', name: 'directorio_cuof', title: 'CUOF' },
          { data: 'acciones', title: 'Acciones', orderable: false, searchable: false },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableDirectorios'),
          '/v1/api/datatables/directorios/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/directorios/{id}/detalle/',
          },
      );
  });

</script>

{% endblock %}

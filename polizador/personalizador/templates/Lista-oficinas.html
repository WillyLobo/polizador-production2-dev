{% extends "base.html" %}
{% load static %}
{% block content %}
{% block title %}<title>Lista Oficinas</title>{% endblock title%}

<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-body-tertiary fw-semibold small">Oficinas</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableOficinas" width="auto" class="table table-striped table-bordered align-middle mb-0">
        </table>
      </div>
    </div>
  </div>
</div>

<script language="javascript">

  $(document).ready(function() {
      var columns = [
          { data: 'cargo_directorio', name: 'cargo_directorio', title: 'Directorio' },
          { data: 'cargo_gerencia', name: 'cargo_gerencia', title: 'Gerencia' },
          { data: 'cargo_direccion', name: 'cargo_direccion', title: 'Dirección' },
          { data: 'cargo_departamento', name: 'cargo_departamento', title: 'Departamento' },
          { data: 'acciones', title: 'Acciones', orderable: false, searchable: false },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableOficinas'),
          '/v1/api/datatables/oficinas/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/oficinas/{id}/detalle/',
          },
      );
  });

</script>

{% endblock %}

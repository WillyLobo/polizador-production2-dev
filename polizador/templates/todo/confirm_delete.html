{% extends "base.html" %}
{% block title %}<title>Eliminar tarea | Polizador</title>{% endblock title %}
{% block content %}
<div class="container-fluid">
  <h3 class="mb-3"><i class="bi bi-trash3 me-2"></i>Eliminar tarea</h3>
  <div class="card" style="max-width: 640px;">
    <div class="card-body">
      <p>¿Confirmás que querés eliminar la tarea "<strong>{{ object.title }}</strong>"?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'todo_list' %}" class="btn btn-outline-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock content %}

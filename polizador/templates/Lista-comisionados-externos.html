{% extends "base.html" %}
{% load static %}
{% block content %}
{% block title %}<title>Lista Comisionados Externos</title>{% endblock title%}

<div class="min-vh-100">
  <div class="card">
    <div class="card-header py-2 bg-body-tertiary fw-semibold small">Comisionados Externos</div>
    <div class="card-body p-2">
      <div class="table-responsive">
        <table id="tableComisionadosExternos" width="auto" class="table table-striped table-bordered align-middle mb-0">
        </table>
      </div>
    </div>
  </div>
</div>


<script language="javascript">

  $(document).ready(function() {
      var columns = [
          { data: 'agente_apellidos', name: 'agente_apellidos', title: 'Apellidos' },
          { data: 'agente_nombres', name: 'agente_nombres', title: 'Nombre' },
          { data: 'institucion_origen', name: 'institucion_origen', title: 'Institución de origen' },
          { data: 'cuil', name: 'cuil', title: 'CUIT' },
          { data: 'acciones', title: 'Acciones', orderable: false, searchable: false },
      ];

      NinjaDatatableUtils.initialize_table(
          $('#tableComisionadosExternos'),
          '/v1/api/datatables/comisionados-externos/',
          columns,
          {
              order: [[0, 'asc']],
              lengthMenu: [[50, 100, -1], [50, 100, 'all']],
              detailUrl: '/v1/api/datatables/comisionados-externos/{id}/detalle/',
          },
      );
  });

</script>

{% endblock %}
